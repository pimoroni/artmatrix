<h1>Install Plugins:</h1>
<br>
<script>
  function loadPlugins() {
    fetch("/index.json")
    .then((response) => response.json())
    .then((data) => {
      for(let plugin of data.plugins) {
        var list = document.getElementById("selected-plugin");
        var item = document.createElement("option");
        item.textContent = plugin;
        list.appendChild(item);
      }
    })

    fetch("/plugins.json")
    .then((response) => response.json())
    .then((data) => {
        Object.keys(data).forEach(key => {
            console.log(`${key}: ${data[key]}`);
            data[key].forEach(plugin => {
                if (plugin) {
                    if (key == "enabled"){
                    var item = document.createElement("li");
                    var list = document.getElementById("enabled_plugins");
                    item.id = `plugin_${plugin}`;
                    item.textContent = `${plugin}`;
                    item.className = "ui-state-highlight ui-sortable-handle";
                    list.appendChild(item);
                } else if (key == "disabled") {
                    var item = document.createElement("li");
                    var list = document.getElementById("disabled_plugins");
                    item.id = `plugin_${plugin}`;
                    item.textContent = `${plugin}`;
                    list.appendChild(item);
                    }
                }
            });
        });
    })
  }

  loadPlugins()  
</script>

<form id="plugin-select" action="/config" method="post">
    <label for="selected-plugin">Select a plugin:</label>
    <br>
    <select name="selected-plugin" id="selected-plugin">
    </select>
    <button type="submit" form="plugin-select">install</button>
</form>

<br>
<h1>Order Plugins:</h1>
<br>

<link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
<style>
#enabled_plugins, #disabled_plugins {
border: 1px solid #eee;
width: 142px;
min-height: 20px;
list-style-type: none;
margin: 0;
padding: 5px 0 0 0;
float: left;
margin-right: 10px;
}
#enabled_plugins li, #disabled_plugins li {
margin: 0 5px 5px 5px;
padding: 5px;
font-size: 1.2em;
width: 120px;
}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
<script>
$( function() {
$( "#enabled_plugins, #disabled_plugins" ).sortable({
    connectWith: ".connectedSortable"
}).disableSelection();
} );
</script>


<ul id="enabled_plugins" class="connectedSortable">
</ul>

<ul id="disabled_plugins" class="connectedSortable">
</ul>

<form id="plugin-reorder" action="/reorder" method="post">
    <input type="hidden" id="enabled_ordered" name="enabled_ordered">
    <input type="hidden" id="disabled_ordered" name="disabled_ordered">
    <button type="submit" onClick="sortLists()" form="plugin-reorder">save order</button>
</form>

<script>
    function sortLists() {
        $( "#enabled_plugins" ).sortable( "refreshPositions" );
        var enabled_sorted = $( "#enabled_plugins" ).sortable( "serialize", {key: "plugin"} );
        var disabled_sorted = $( "#disabled_plugins" ).sortable( "serialize", {key: "plugin"} );
        enabled_input = document.getElementById("enabled_ordered");
        enabled_input.value = enabled_sorted;
        disabled_input = document.getElementById("disabled_ordered");
        disabled_input.value = disabled_sorted;
    }
</script>
