<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/stylesheet.css">
    <title>Art Matrix Configuration</title>
</head>

<header>
    <img src="/static/logo.svg" alt="Art Matrix">
</header>

<hr>
<section id="installation">
    <h3>Install Plugins:</h3>
    <form id="plugin-select" action="/" method="post">
        <select name="selected-plugin" id="selected-plugin">
        </select>
        <button type="submit" form="plugin-select" id="install-button">Install</button>
    </form>
</section>
<hr>
<section id="ordering">
    <h3>Order Plugins:</h3>
    <ul id="all_plugins">
    </ul>

</section>
<hr>
<section id="timing">
    <h3>Time between plugins:</h3>
    <form id="plugin-reorder" action="/reorder" method="post">
        <input type="number" form="plugin-reorder" id="delay_value" name="delay_value" value="{{delay_value}}">
        <select form="plugin-reorder" id="delay_unit" name="delay_unit">
            <option value="seconds" {{ "selected" if delay_unit == "seconds" else "" }}>seconds</option>
            <option value="minutes" {{ "selected" if delay_unit == "minutes" else "" }}>minutes</option>
            <option value="hours" {{ "selected" if delay_unit == "hours" else "" }}>hours</option>
        </select>
    </form>
    <button type="submit" form="plugin-reorder">Apply</button>
</section>
<hr>
<section id="display">
    <h3>Display:</h3>
    <label>Global brightness
      <small>Applies to every plugin. Takes effect straight away.</small>
      <div>
        <input type="range" id="brightness" name="brightness"
               min="5" max="100" step="1" value="{{config.brightness}}">
        <output for="brightness" id="brightness_value">{{config.brightness}}</output>
      </div>
    </label>
</section>
<hr>
<section id="reboot">
    <h3>System:</h3>
    <div>
      <label>Clock</label>
      <small>Sync the clock with an internet time server.</small>
      <div>
        <button type="button" id="sync_time">Sync Time</button>
        <output for="sync_time" id="sync_time_status"></output>
      </div>
    </div>
    <hr>
    <div>
      <label>Firmware</label>
      <small>{{version}}</small>
      <small><a href="https://github.com/pimoroni/artmatrix/releases" target="_blank" rel="noopener">Latest releases on GitHub</a></small>
    </div>
    <hr>
    <div>
      <label>Memory</label>
      <div class="usage">
        <span class="usage-name">Flash</span>
        <output class="usage-figures" id="flash_figures">…</output>
        <div class="usage-bar"><span id="flash_bar"></span></div>
      </div>
      <div class="usage">
        <span class="usage-name">RAM</span>
        <output class="usage-figures" id="mem_figures">…</output>
        <div class="usage-bar"><span id="mem_bar"></span></div>
      </div>
      <div class="usage" id="sd_row" hidden>
        <span class="usage-name">SD Card</span>
        <output class="usage-figures" id="sd_figures">…</output>
        <div class="usage-bar"><span id="sd_bar"></span></div>
      </div>
      <p class="usage-legend">
        <span class="used">Used</span>
        <span class="free">Free</span>
      </p>
    </div>
    <hr>
    <div>
      <label>Reboot</label>
      <small>Restarts the Art Matrix. Your settings are kept.</small>
      <form id="reboot-art-matrix" action="/reboot" method="post"
            onsubmit="return window.confirm('Reboot the Art Matrix?');">
          <input type="hidden" name="confirm" value="1">
          <button type="submit" class="warning" >Reboot</button>
      </form>
    </div>
</section>

{{ render_template("/html/footer.html") }}

<script>
  (() => {
    const slider  = document.getElementById("brightness");
    const readout = document.getElementById("brightness_value");

    slider.addEventListener("input", () => {
      readout.textContent = slider.value;
    });

    slider.addEventListener("change", () => {
      fetch(`/brightness?value=${slider.value}`, { method: "POST" })
        .catch(() => {});
    });

    const sync    = document.getElementById("sync_time");
    const status  = document.getElementById("sync_time_status");

    sync.addEventListener("click", () => {
      sync.disabled = true;
      status.textContent = "Syncing…";

      // phew needs at least one field or the body arrives empty
      fetch("/synctime", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "confirm=1"
      })
        .then((response) => response.text())
        .then((text) => { status.textContent = text; })
        .catch(() => { status.textContent = "Time sync failed"; })
        .finally(() => { sync.disabled = false; });
    });

    fetch("/usage.json")
      .then((response) => response.json())
      .then((data) => {
        // a whole number of MB hides the difference between 12.8 and 13.0, which
        // is the whole point of the figure on a device this size
        const size = (bytes) => {
          const kb = bytes / 1024;
          if (kb < 1024) return `${Math.round(kb)} KB`;
          const mb = kb / 1024;
          return mb < 1024 ? `${mb.toFixed(1)} MB` : `${(mb / 1024).toFixed(1)} GB`;
        };

        const rows = [["flash", data.flash_total, data.flash_free],
                      ["mem", data.mem_total, data.mem_free]];

        if (data.sd_total) {
          rows.push(["sd", data.sd_total, data.sd_free]);
          document.getElementById("sd_row").hidden = false;
        }

        for (const [name, total, free] of rows) {
          document.getElementById(`${name}_figures`).textContent =
            `${size(free)} free of ${size(total)}`;
          document.getElementById(`${name}_bar`).style.width =
            `${(100 * (total - free)) / total}%`;
        }
      })
      .catch(() => {
        for (const name of ["flash", "mem"]) {
          document.getElementById(`${name}_figures`).textContent = "Unavailable";
        }
      });
  })();
</script>

<script>
    // The index is fetched in the background on the device, so a cold boot can
    // answer "pending" before the first refresh lands.
    function loadIndex(attempt = 0) {
        fetch("/index.json")
        .then((response) => response.json())
        .then((data) => {
            if (data.pending) {
                if (attempt < 10) setTimeout(() => loadIndex(attempt + 1), 2000);
                return;
            }
            var list = document.getElementById("selected-plugin");
            var button = document.getElementById("install-button");

            list.replaceChildren();
            for(let plugin of data.plugins) {
                var item = document.createElement("option");
                item.textContent = plugin
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
                item.value = plugin;
                list.appendChild(item);
            }

            if (data.plugins.length === 0) {
                var empty = document.createElement("option");
                empty.textContent = "All plugins installed";
                list.appendChild(empty);
            }
            list.disabled = button.disabled = data.plugins.length === 0;
        });
    }

    // Re-fetch just the plugin list after a mutation. A full page reload cost the
    // stylesheet and the index fetch again for every click.
    function loadPluginList() {
        return fetch("/plugins.json")
        .then((response) => response.json())
        .then((data) => {
            document.getElementById("all_plugins").replaceChildren();
            for (const key of Object.keys(data)) {
                for (const plugin of data[key]) {

                    var config_link = document.createElement("button");
                    config_link.className = "icon settings";
                    config_link.title = "Configure";
                    config_link.onclick = function() {
                        window.location.href = `/config?plugin=${plugin}`;
                    }
                    
                    var move_pos_up = document.createElement("button");
                    move_pos_up.className = "icon arrow-up";
                    move_pos_up.title = "Move up";
                    move_pos_up.onclick = function() {
                        fetch(`/position?plugin=${plugin}&action=up`, {
                            method: 'POST',
                        }).then(() => loadPluginList());
                    }
                    
                    var move_pos_down = document.createElement("button");
                    move_pos_down.className = "icon arrow-down";
                    move_pos_down.title = "Move down";
                    move_pos_down.onclick = function() {
                        fetch(`/position?plugin=${plugin}&action=down`, {
                            method: 'POST',
                        }).then(() => loadPluginList());
                    }

                    var remove_link = document.createElement("button");
                    remove_link.className = "icon delete";
                    remove_link.title = "Delete";
                    remove_link.onclick = function() {
                        if (!window.confirm(`Delete ${plugin}? This removes its files from the device.`)) return;
                        fetch(`/remove?plugin=${plugin}`, {
                            method: 'POST',
                        }).then(() => { loadPluginList(); loadIndex(); });
                    }

                    var enable_toggle = document.createElement("input");
                    enable_toggle.type = "checkbox";
                    enable_toggle.role = "switch";
                    enable_toggle.id = `${plugin}_checkbox`;

                    enable_toggle.addEventListener("click", function() {
                        console.log(this.id);
                        fetch(`/active?plugin=${plugin}&state=${this.checked}`, {
                            method: 'POST',
                        })
                        .then(() => loadPluginList());
                    });

                    if (plugin) {
                        var item = document.createElement("li");
                        var list = document.getElementById("all_plugins");
                        item.id = plugin;

                        var text_span = document.createElement("span");
                        text_span.className = "plugin-text";
                        text_span.textContent = `${plugin}`.replace(/(^|_)[a-z]/g, (a) => {return (a[1] ? ' ' + a[1] : a[0]).toUpperCase();});
                        item.appendChild(text_span);
                        
                        if (key == "enabled"){
                            item.appendChild(move_pos_up);
                            item.appendChild(move_pos_down);
                            enable_toggle.checked = "checked";
                        }

                        item.appendChild(config_link);

                        item.appendChild(enable_toggle);
                        item.className = key;
                        list.appendChild(item);

                        item.appendChild(remove_link);
                    }
                }
            }
        });
    }

    loadIndex();
    loadPluginList();
</script>
