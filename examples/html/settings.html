<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/stylesheet.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap&icon_names=arrow_downward,arrow_upward,delete,settings">
    <title>Art Matrix Configuration</title>
</head>
<hr>
<section id="installation">
    <h3>Install Plugins:</h3>
    <form id="plugin-select" action="/" method="post">
        <select name="selected-plugin" id="selected-plugin">
        </select>
        <button type="submit" form="plugin-select">Install</button>
    </form>
</section>
<hr>
<section id="ordering">
    <h3>Order Plugins:</h3>
    <ul id="all_plugins">
    </ul>

</section>
<hr>
<section id="timing">
    <h3>Time between plugins (seconds):</h3>
    <form id="plugin-reorder" action="/reorder" method="post">
        <input type="number" form="plugin-reorder" id="delay_time" name="delay_time" min="5" value={{config.delay}}>
    </form>
    <button type="submit" form="plugin-reorder">Apply</button>
</section>
<hr>

<script>
    function loadPlugins() {
        fetch("/index.json")
        .then((response) => response.json())
        .then((data) => {
            for(let plugin of data.plugins) {
                var list = document.getElementById("selected-plugin");
                var item = document.createElement("option");
                item.textContent = plugin
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
                item.value = plugin;
                list.appendChild(item);
            }
        });

        fetch("/plugins.json")
        .then((response) => response.json())
        .then((data) => {
            for (const key of Object.keys(data)) {
                for (const plugin of data[key]) {

                    var config_link = document.createElement("button");
                    config_link.className = "material-symbols-outlined";
                    config_link.textContent = "settings";
                    config_link.onclick = function() {
                        window.location.href = `/config?plugin=${plugin}`;
                    }
                    
                    var move_pos_up = document.createElement("button");
                    move_pos_up.className = "material-symbols-outlined";
                    move_pos_up.textContent = "arrow_upward";
                    move_pos_up.onclick = function() {
                        fetch(`/position?plugin=${plugin}&action=up`, {
                            method: 'POST',
                        }).then(() => location.reload());
                    }
                    
                    var move_pos_down = document.createElement("button");
                    move_pos_down.className = "material-symbols-outlined";
                    move_pos_down.textContent = "arrow_downward";
                    move_pos_down.onclick = function() {
                        fetch(`/position?plugin=${plugin}&action=down`, {
                            method: 'POST',
                        }).then(() => location.reload());
                    }

                    var remove_link = document.createElement("button");
                    remove_link.className = "material-symbols-outlined";
                    remove_link.textContent = "delete";
                    remove_link.onclick = function() {
                        fetch(`/remove?plugin=${plugin}`, {
                            method: 'POST',
                        }).then(() => location.reload());
                    }

                    var enable_toggle = document.createElement("input");
                    enable_toggle.type = "checkbox";
                    enable_toggle.role = "switch";
                    enable_toggle.id = `${plugin}_checkbox`;

                    enable_toggle.addEventListener("click", function() {
                        console.log(this.id);
                        fetch(`/active?plugin=${plugin}&state=${this.checked}`, {
                            method: 'POST',
                        })
                        .then(() => {
                            document.location.reload();
                        })
                    });

                    if (plugin) {
                        var item = document.createElement("li");
                        var list = document.getElementById("all_plugins");
                        item.id = plugin;

                        var text_span = document.createElement("span");
                        text_span.className = "plugin-text";
                        text_span.textContent = `${plugin}`.replace(/(^|_)[a-z]/g, (a) => {return (a[1] ? ' ' + a[1] : a[0]).toUpperCase();});
                        item.appendChild(text_span);
                        
                        if (key == "enabled"){
                            item.appendChild(move_pos_up);
                            item.appendChild(move_pos_down);
                            enable_toggle.checked = "checked";
                        }

                        item.appendChild(config_link);

                        item.appendChild(enable_toggle);
                        item.className = key;
                        list.appendChild(item);

                        item.appendChild(remove_link);
                    }
                }
            }
        });
    }

    loadPlugins();
</script>
