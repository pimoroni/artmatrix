<section id="rebooting">
    <h3>Rebooting&hellip;</h3>
    <p>This page will come back by itself once the Art Matrix is up again.</p>
</section>

<script>
// poll until the board answers again, then go back to the settings page
const poll = () => {
    const c = new AbortController();
    setTimeout(() => c.abort(), 2000);
    fetch("/", {signal: c.signal})
        .then(() => location.replace("/"), () => setTimeout(poll, 500));
};
setTimeout(poll, 2000);
</script>
